<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد الصم والبكم</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#e0719a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مساعد الصم">
<style>
:root[data-theme="white"]{--bg:#ffffff;--card:#f4f6fa;--text:#1b2433;--accent:#3b6cf6;--border:#dfe4ee;--bad:#e5484d}
:root[data-theme="beige"]{--bg:#f3ead9;--card:#fbf5e8;--text:#4a3b28;--accent:#b5793a;--border:#e0d2b6;--bad:#c4503a}
:root[data-theme="black"]{--bg:#0f1115;--card:#1a1d24;--text:#eef1f6;--accent:#f0b429;--border:#2b303b;--bad:#ff6b6b}
:root[data-theme="pink"]{--bg:#fff0f5;--card:#ffe4ec;--text:#5a2a3c;--accent:#e0719a;--border:#f5c6d6;--bad:#d64561}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.3s}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.hl{display:flex;align-items:center;gap:10px}
.logo{font-size:26px}
.offi{font-size:16px}
.inst{display:none;padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:18px}
.themes{display:flex;gap:8px}
.themes button{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
.themes button.active{border-color:var(--accent);transform:scale(1.15)}
.t-white{background:#fff}.t-beige{background:#e8d7b5}.t-black{background:#111}.t-pink{background:#fff0f5}
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border:none;border-radius:16px;background:transparent;color:var(--text);opacity:.6;cursor:pointer;font-family:inherit;transition:.2s}
nav button .ni{font-size:28px;line-height:1.15}
nav button .nl{font-size:14px;font-weight:700}
nav button.active{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
nav button.active::before{content:"";position:absolute;top:-9px;left:28%;right:28%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
main{max-width:980px;margin:0 auto;padding:10px 18px calc(112px + env(safe-area-inset-bottom))}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fadein{animation:fi .22s ease-out}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.pic{display:flex;align-items:center;justify-content:center;width:var(--pic,90px);height:var(--pic,90px)}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.emo{font-size:64px;line-height:1}
.ic{width:1.1em;height:1.1em;object-fit:contain;vertical-align:middle;display:inline-block}
.label{font-size:16px;font-weight:600}
.flat .card{background:transparent;border-color:transparent}
.flat .card:hover{box-shadow:none;background:var(--card)}
.flat .pic img{border-radius:0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.wcard{aspect-ratio:16/9;min-height:0;padding:10px}
.wcard .pic{width:100%;height:100%}
.wcard .emo{font-size:72px}
.flat .wcard{background:var(--card);border-color:var(--border)}
.blend .pic img{mix-blend-mode:multiply}
html[data-theme="black"] .blend .pic img{mix-blend-mode:normal}
.big .pic{width:min(70vw,300px);height:min(70vw,300px)}
.big .pic img{mix-blend-mode:normal!important;border-radius:12px}
.big .emo{font-size:150px}
.big.wide .pic{width:100%;height:min(55vw,300px)}
.empty{text-align:center;padding:40px;font-size:50px;opacity:.5}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--bg);border-radius:24px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;position:relative}
.close{position:absolute;top:10px;left:14px;font-size:26px;background:none;border:none;color:var(--text);cursor:pointer}
.sheet h2{font-size:30px;margin:6px 0}
/* voice */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 18px}
.mic{width:110px;height:110px;border-radius:50%;border:4px solid var(--accent);background:var(--card);font-size:48px;cursor:pointer;transition:.2s}
.mic.rec{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.vhint{font-size:20px;font-weight:700;text-align:center;line-height:1.7;max-width:420px}
.vstat{font-size:15px;text-align:center;opacity:.9;min-height:20px}
.vmsg{font-size:15px;text-align:center;min-height:20px;font-weight:600}
.offb{display:inline-block;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:15px}
.heard{text-align:center;font-size:18px;opacity:.8;margin:8px 0}
.vcards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:10px 0 24px}
.vcard{background:var(--card);border:2px solid var(--accent);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:min(80vw,260px)}
.vcard .pic{width:min(55vw,220px);height:min(55vw,220px)}
.vcard .emo{font-size:130px}
.vl{font-size:28px;font-weight:700}
.dlab{font-size:44px;line-height:1}
.cal{width:min(60vw,230px);border:3px solid var(--accent);border-radius:20px;overflow:hidden;background:var(--bg);text-align:center}
.calm{background:var(--accent);color:#fff;font-size:24px;font-weight:700;padding:8px}
.cald{font-size:84px;font-weight:800;line-height:1.1;padding-top:6px}
.calw{font-size:26px;font-weight:700}
.caly{font-size:18px;opacity:.7;padding-bottom:10px}
.sep{border:none;border-top:1px solid var(--border);margin:24px 0 20px}
.cta{gap:4px;padding:12px}
.cico{font-size:44px;line-height:1}
.ctt{font-size:38px;font-weight:800;line-height:1.2}
.cts{font-size:17px;font-weight:600;opacity:.85;line-height:1.5}
.mb{margin-top:34px}
.txtwrap{display:flex;flex-direction:column;align-items:stretch;margin-bottom:14px}
.tin{width:100%;min-height:96px;padding:14px;border-radius:16px;border:2px solid var(--border);background:var(--card);color:var(--text);font:600 20px "Segoe UI",Tahoma,sans-serif;outline:none;resize:vertical}
.tin:focus{border-color:var(--accent)}
.go{margin-top:12px;padding:14px 28px;border:none;border-radius:16px;background:var(--accent);color:#fff;font:700 20px "Segoe UI",Tahoma,sans-serif;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="hl">
    <div class="logo">🤟</div>
    <span class="offi" id="offi"></span>
    <button class="inst" id="inst" title="تثبيت">📲</button>
  </div>
  <div class="themes">
    <button class="t-white" data-t="white" title="أبيض"></button>
    <button class="t-beige" data-t="beige" title="بيج"></button>
    <button class="t-black" data-t="black" title="أسود"></button>
    <button class="t-pink" data-t="pink" title="وردي"></button>
  </div>
</header>

<nav>
  <button data-tab="win" class="active"><span class="ni"><img src="image.jpg" style="width: 24px; height: 24px;display: block; margin:0 auto"></span><span class="nl">النوافذ</span></button>
  <button data-tab="voice"><span class="ni">🎙️</span><span class="nl">التواصل</span></button>
</nav>

<main id="view"></main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============ البيانات (من Supabase) ============ */
const SUPABASE_URL = "https://mxlaeygympuvsppvjivl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14bGFleWd5bXB1dnNwcHZqaXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTA3NDMsImV4cCI6MjEwNzIyNjc0M30.mfy_J-lPmfl5CBfZ3JSmabxtnkKexunU4GRHxj1W-p0";
const API = p => SUPABASE_URL + "/rest/v1/" + p;
const Q = {
  win:"windows?select=*&order=sort",
  phr:"phrases?select=*&order=sort",
  ui:"settings?select=value&key=eq.ui"
};
let WINS = [], PHRASES = [], UI = {};

async function loadData(){
  const h = {apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY};
  const get = p => fetch(API(p),{headers:h}).then(r=>{if(!r.ok)throw new Error("http");return r.json()});
  const [w,p,s] = await Promise.all([get(Q.win), get(Q.phr), get(Q.ui).catch(()=>[])]);
  UI = (Array.isArray(s) && s[0] && s[0].value) || {};
  WINS = w.map(x=>({id:x.id,title:x.title,emoji:x.emoji,img:x.image_url}));
  PHRASES = p.map(x=>({id:x.id,title:x.title,keywords:x.keywords,emoji:x.emoji,img:x.image_url}));
}

/* ============ التصميم (من لوحة الأدمن) ============ */
const DEF_THEMES = {
  white:{bg:"#ffffff",card:"#f4f6fa",text:"#1b2433",accent:"#3b6cf6",border:"#dfe4ee"},
  beige:{bg:"#f3ead9",card:"#fbf5e8",text:"#4a3b28",accent:"#b5793a",border:"#e0d2b6"},
  black:{bg:"#0f1115",card:"#1a1d24",text:"#eef1f6",accent:"#f0b429",border:"#2b303b"},
  pink:{bg:"#fff0f5",card:"#ffe4ec",text:"#5a2a3c",accent:"#e0719a",border:"#f5c6d6"}
};
const DEF_STYLE = {flat:true, blend:true, size:100};
const okHex = v => /^#[0-9a-f]{6}$/i.test(v||"");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mergedTheme(n){
  const o=(UI.themes||{})[n]||{}, d=DEF_THEMES[n], r={};
  Object.keys(d).forEach(k=>r[k]=okHex(o[k])?o[k]:d[k]);
  return r;
}
const ico = (k,def) => {
  const v=(UI.icons||{})[k];
  if(v&&v.url) return `<img class="ic" src="${esc(v.url)}" alt="">`;
  return esc((v&&v.emoji)||def);
};
function applyUI(){
  let css="";
  Object.keys(DEF_THEMES).forEach(n=>{
    const m=mergedTheme(n);
    css+=`:root[data-theme="${n}"]{--bg:${m.bg};--card:${m.card};--text:${m.text};--accent:${m.accent};--border:${m.border}}`;
  });
  let el=document.getElementById("dyn");
  if(!el){el=document.createElement("style");el.id="dyn";document.head.appendChild(el)}
  el.textContent=css;
  document.querySelectorAll(".themes button").forEach(b=>{b.style.background=mergedTheme(b.dataset.t).bg});
  document.querySelector(".logo").innerHTML=ico("logo","🤟");
  document.querySelector('nav [data-tab="win"] .ni').innerHTML=ico("win",<img src="image.jpg" style="width: 24px; height: 24px; display:block; margin:0 auto;">);
  document.querySelector('nav [data-tab="voice"] .ni').innerHTML=ico("voice","🎙️");
  const s={...DEF_STYLE,...(UI.style||{})};
  document.body.classList.toggle("flat",!!s.flat);
  document.body.classList.toggle("blend",!!s.blend);
  document.documentElement.style.setProperty("--pic",(Number(s.size)||100)+"px");
}

/* ============ أدوات ============ */
const $ = s => document.querySelector(s);
const view = $("#view");
function fb(img,txt){const s=document.createElement("span");s.className="emo";s.textContent=txt;img.replaceWith(s)}
window.fb = fb;
const pic = o => {
  const e = esc(o.emoji||"🖼️");
  return o.img
    ? `<span class="pic"><img src="${esc(o.img)}" alt="" onerror="fb(this,'${e}')"></span>`
    : `<span class="emo">${e}</span>`;
};
const nrm = s => String(s==null?"":s).replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g," ").replace(/\s+/g," ").trim();

/* ============ الثيمات ============ */
function setTheme(t){
  document.documentElement.dataset.theme=t;
  document.querySelectorAll(".themes button").forEach(b=>b.classList.toggle("active",b.dataset.t===t));
  try{localStorage.setItem("theme",t)}catch(e){}
}
document.querySelectorAll(".themes button").forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
let saved="pink"; try{saved=localStorage.getItem("theme")||"pink"}catch(e){}
setTheme(saved);

/* ============ التبويبات ============ */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
  if(voiceRec){try{voiceRec.abort()}catch(e){}}
  ({win:showWins,voice:showVoice})[b.dataset.tab]();
  window.scrollTo(0,0);
  view.classList.remove("fadein"); void view.offsetWidth; view.classList.add("fadein");
});

/* ============ 1) النوافذ ============ */
function showWins(){
  view.innerHTML = WINS.length
    ? `<div class="wgrid">${WINS.map(w=>`<div class="card wcard" data-w="${esc(w.id)}">${pic(w)}</div>`).join("")}</div>`
    : `<div class="empty">image.jpg</div>`;
  view.querySelectorAll("[data-w]").forEach(el=>el.onclick=()=>openWin(WINS.find(w=>w.id===el.dataset.w)));
}
function openWin(w){
  $("#sheet").innerHTML = `<button class="close">✖</button>
    <div class="big wide">${pic(w)}</div>
    <h2>${esc(w.title)}</h2>`;
  $("#modal").classList.add("show");
  $(".close").onclick=closeModal;
}
function closeModal(){
  if(voiceRec){try{voiceRec.abort()}catch(e){}}
  $("#modal").classList.remove("show");
}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

/* ============ 2) الصوت ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANGS = ["ar-IQ","ar-SA","ar-EG","ar"];
let voiceInfo = null, voiceRec = null;

async function probeVoice(){
  if(!SR) return {kind:"none"};
  let bad=false; try{bad=localStorage.getItem("probeBad")==="1"}catch(e){}
  if(!bad && typeof SR.available==="function"){
    try{localStorage.setItem("probeBad","1")}catch(e){}
    let dl=null;
    try{
      for(const l of LANGS){
        try{
          const s=await Promise.race([
            SR.available({langs:[l],processLocally:true}),
            new Promise((_,rej)=>setTimeout(()=>rej(new Error("t")),2500))
          ]);
          if(s==="available") return {kind:"local",lang:l};
          if(!dl&&(s==="downloadable"||s==="downloading")) dl=l;
        }catch(e){}
      }
    }finally{
      try{localStorage.removeItem("probeBad")}catch(e){}
    }
    if(dl) return {kind:"download",lang:dl};
  }
  return {kind:"cloud",lang:"ar-IQ"};
}
/* ===== المواعيد: تواريخ من الكلام ===== */
const MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const WDAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const WD_KEYS=["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعه","السبت"];
const NUMW={"واحد":1,"اثنين":2,"اثنان":2,"ثلاث":3,"ثلاثه":3,"ثلث":3,"اربع":4,"اربعه":4,"خمس":5,"خمسه":5,"ست":6,"سته":6,"سبع":7,"سبعه":7,"ثمان":8,"ثمانيه":8,"تسع":9,"تسعه":9,"عشر":10,"عشره":10};
const UNITS={"يوم":["d",1],"يومين":["d",2],"ايام":["d",0],"اسبوع":["w",1],"اسبوعين":["w",2],"اسابيع":["w",0],"شهر":["m",1],"شهرين":["m",2],"شهور":["m",0],"اشهر":["m",0]};
const LIMIT={d:90,w:26,m:24};
const UEMO={d:"☀️",w:"🗓️",m:"🌙"};
const KEYCAP=n=>String(n).split("").map(c=>c+"\uFE0F\u20E3").join("");
const midnight=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function addMonths(d,n){
  const r=new Date(d.getFullYear(),d.getMonth()+n,1);
  const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();
  r.setDate(Math.min(d.getDate(),last));
  return r;
}
function dateItem(k,n,label,dlab){
  const t=midnight(); let d;
  if(k==="m") d=addMonths(t,n);
  else {d=new Date(t); d.setDate(d.getDate()+(k==="w"?7*n:n));}
  return {date:true,d:d,label:label,dlab:dlab};
}
function weekdayItem(i){
  const t=midnight(), diff=((i-t.getDay()+7)%7)||7;
  const d=new Date(t); d.setDate(d.getDate()+diff);
  return {date:true,d:d,label:"يوم "+WDAYS[i],dlab:"🗓️"};
}
function unitLabel(k,n){
  const one={d:"يوم",w:"أسبوع",m:"شهر"}, two={d:"يومين",w:"أسبوعين",m:"شهرين"}, many={d:"أيام",w:"أسابيع",m:"أشهر"};
  if(n===1) return "بعد "+one[k];
  if(n===2) return "بعد "+two[k];
  return "بعد "+n+" "+(n<=10?many[k]:one[k]);
}
function toNum(w){
  if(!w) return null;
  const x=w.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632));
  if(/^\d{1,3}$/.test(x)) return parseInt(x,10);
  return NUMW[x]!==undefined?NUMW[x]:null;
}
function parseDates(text){
  const norm=nrm(text), toks=[...norm.matchAll(/\S+/g)].map(m=>({w:m[0],i:m.index}));
  const T1=["باجر","بكره","غدا","غد"], out=[];
  for(let i=0;i<toks.length;i++){
    const w=toks[i].w, pos=toks[i].i;
    if(w==="بعد"){
      const a=toks[i+1]&&toks[i+1].w, b=toks[i+2]&&toks[i+2].w;
      if(a&&T1.includes(a)){out.push({pos:pos,it:dateItem("d",2,"بعد باجر","2️⃣☀️")});i+=1;continue}
      if(a&&UNITS[a]){
        const k=UNITS[a][0], n0=UNITS[a][1];
        if(n0>0&&n0<=LIMIT[k]){out.push({pos:pos,it:dateItem(k,n0,unitLabel(k,n0),KEYCAP(n0)+UEMO[k])});i+=1;continue}
      }
      const n=toNum(a);
      if(n!==null&&b&&UNITS[b]){
        const k=UNITS[b][0];
        if(n>0&&n<=LIMIT[k]){out.push({pos:pos,it:dateItem(k,n,unitLabel(k,n),KEYCAP(n)+UEMO[k])});i+=2;continue}
      }
      continue;
    }
    if(T1.includes(w)){out.push({pos:pos,it:dateItem("d",1,"باجر","1️⃣☀️")});continue}
    if(w==="اليوم"){out.push({pos:pos,it:dateItem("d",0,"اليوم","📍")});continue}
    const wd=WD_KEYS.indexOf(w);
    if(wd>=0){out.push({pos:pos,it:weekdayItem(wd)});continue}
  }
  return out;
}
const QUICK=[
  {l:"باجر",f:()=>dateItem("d",1,"باجر","1️⃣☀️")},
  {l:"بعد باجر",f:()=>dateItem("d",2,"بعد باجر","2️⃣☀️")},
  {l:"بعد 3 أيام",f:()=>dateItem("d",3,unitLabel("d",3),KEYCAP(3)+UEMO.d)},
  {l:"بعد أسبوع",f:()=>dateItem("w",1,unitLabel("w",1),KEYCAP(1)+UEMO.w)},
  {l:"بعد أسبوعين",f:()=>dateItem("w",2,unitLabel("w",2),KEYCAP(2)+UEMO.w)},
  {l:"بعد شهر",f:()=>dateItem("m",1,unitLabel("m",1),KEYCAP(1)+UEMO.m)}
];
function dateCard(it){
  const d=it.d;
  return `<div class="vcard"><div class="dlab">${it.dlab}</div>
    <div class="cal"><div class="calm">${MONTHS[d.getMonth()]}</div><div class="cald">${d.getDate()}</div><div class="calw">${WDAYS[d.getDay()]}</div><div class="caly">${d.getFullYear()}</div></div>
    <div class="vl">${esc(it.label)}</div></div>`;
}
/* ===== نهاية المواعيد ===== */

function phraseHits(text){
  const t=" "+nrm(text)+" ", hits=[];
  PHRASES.forEach(p=>{
    const kws=[p.title,...String(p.keywords||"").split(/[,،\n]/)].map(k=>nrm(k).replace(/^ال/,"")).filter(Boolean);
    let best=-1;
    kws.forEach(k=>{
      const i = k.length<3 ? t.indexOf(" "+k+" ") : t.indexOf(k);
      if(i>=0&&(best<0||i<best)) best=i;
    });
    if(best>=0) hits.push([best,p]);
  });
  return hits;
}
function analyze(first,all){
  const out=[], seen={};
  phraseHits(all).forEach(h=>out.push([h[0],h[1]]));
  parseDates(first).forEach(d=>{
    if(seen[d.it.label]) return;
    seen[d.it.label]=1;
    out.push([d.pos+1,d.it]);
  });
  return out.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
function showResult(list,heard){
  const el=$("#vres"); if(!el) return;
  const h = heard ? `<div class="heard">«${esc(heard)}»</div>` : "";
  el.innerHTML = list.length
    ? h+`<div class="vcards">${list.map(p=>p.date?dateCard(p):`<div class="vcard">${pic(p)}<div class="vl">${esc(p.title)}</div></div>`).join("")}</div>`
    : h+`<div class="empty">🤷</div>`;
}
function vmsg(t){const m=$("#vmsg"); if(m) m.textContent=t||""}
function renderVStatus(){
  const st=$("#vst"); if(!st) return;
  let t="";
  if(!SR) t="❌ هذا المتصفح ما يدعم التعرف الصوتي. استخدم الصور بالأسفل.";
  else if(!voiceInfo) t="⏳ ...";
  else if(voiceInfo.kind==="local") t="🟢 الصوت يعمل بدون نت";
  else if(voiceInfo.kind==="download") t="🟡 تحتاج تنزيل الصوت العربي مرة وحدة (يحتاج نت)";
  else t=navigator.onLine ? "🟡 الصوت يعمل مع النت فقط على هذا الجهاز" : "📴 لا يوجد نت: استخدم الصور بالأسفل";
  st.textContent=t;
  if(SR&&voiceInfo&&voiceInfo.kind==="download"){
    const b=document.createElement("button");
    b.className="offb"; b.textContent="⬇️ تنزيل الصوت العربي";
    b.onclick=async()=>{
      try{
        st.textContent="⏳ جاري التنزيل...";
        await SR.install({langs:[voiceInfo.lang],processLocally:true});
        voiceInfo=await probeVoice();
      }catch(e){st.textContent="❌ تعذّر التنزيل. تأكد من النت وجرب مرة ثانية.";return}
      renderVStatus();
    };
    st.appendChild(document.createElement("br"));
    st.appendChild(b);
  }
}
async function toggleMic(){
  if(!SR){vmsg("❌ هذا المتصفح ما يدعم الصوت. استخدم Chrome أو Edge أو Safari.");return}
  if(voiceRec){voiceRec.stop();return}
  if(!voiceInfo){voiceInfo=await probeVoice();renderVStatus()}
  if(voiceInfo.kind==="download"){vmsg("نزّل الصوت العربي أولاً ⬇️");return}
  if(voiceInfo.kind==="cloud"&&!navigator.onLine){vmsg("📴 بدون نت الصوت ما يشتغل هنا، استخدم الصور.");return}
  vmsg("");
  startRec(0);
}
function startRec(i){
  const langs = voiceInfo.kind==="local" ? [voiceInfo.lang] : [voiceInfo.lang,...LANGS.filter(l=>l!==voiceInfo.lang)];
  const rec=new SR();
  rec.lang=langs[i]; rec.continuous=false; rec.interimResults=false; rec.maxAlternatives=3;
  if(voiceInfo.kind==="local") rec.processLocally=true;
  rec.onresult=ev=>{
    const alts=[];
    for(let a=0;a<ev.results.length;a++) for(let j=0;j<ev.results[a].length;j++) alts.push(ev.results[a][j].transcript);
    showResult(analyze(alts[0]||"",alts.join(" ")),alts[0]||"");
    vmsg("");
  };
  rec.onerror=ev=>{
    if(ev.error==="aborted") return;
    if(ev.error==="language-not-supported"&&i+1<langs.length){voiceRec=null;startRec(i+1);return}
    const m={
      "not-allowed":"🎙️ اسمح للمتصفح باستخدام المايك",
      "service-not-allowed":"🎙️ اسمح للمتصفح باستخدام المايك",
      "no-speech":"ما سمعت شي، جرب مرة ثانية",
      "network":"📴 الصوت يحتاج نت على هذا الجهاز",
      "language-not-supported":"اللغة العربية غير مدعومة هنا"
    };
    vmsg(m[ev.error]||("❌ "+ev.error));
  };
  rec.onend=()=>{if(voiceRec===rec){voiceRec=null;const mic=$("#mic");if(mic)mic.classList.remove("rec")}};
  try{
    voiceRec=rec; rec.start();
    const mic=$("#mic"); if(mic) mic.classList.add("rec");
  }catch(e){
    voiceRec=null;
    const mic=$("#mic"); if(mic) mic.classList.remove("rec");
    vmsg("❌ تعذّر تشغيل المايك");
  }
}
function openSheet(html){
  $("#sheet").innerHTML = `<button class="close">✖</button>`+html;
  $("#modal").classList.add("show");
  $(".close").onclick=closeModal;
}
function openVoiceModal(){
  openSheet(`<div class="micwrap mb">
      <button class="mic" id="mic">🎙️</button>
      <div class="vhint">احجي بالمايك والصوت راح يحوله لصور افتهمهن</div>
      <div class="vstat" id="vst"></div>
      <div class="vmsg" id="vmsg"></div>
    </div>
    <div id="vres"></div>`);
  $("#mic").onclick=toggleMic;
  renderVStatus();
  if(!voiceInfo) probeVoice().then(v=>{voiceInfo=v;renderVStatus()});
}
function openTextModal(){
  openSheet(`<div class="txtwrap mb">
      <textarea class="tin" id="tin" rows="3" placeholder="اكتب هنا..."></textarea>
      <button class="go" id="tgo">حوّل لصور</button>
    </div>
    <div id="vres"></div>`);
  const go=()=>{
    const v=$("#tin").value.trim();
    if(!v){$("#tin").focus();return}
    showResult(analyze(v,v),v);
    const r=$("#vres"); if(r) r.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
  $("#tgo").onclick=go;
  $("#tin").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}};
  $("#tin").focus();
}
function openResultModal(list){
  openSheet(`<div class="mb"><div id="vres"></div></div>`);
  showResult(list,"");
}
function showVoice(){
  view.innerHTML = `<div class="wgrid">
      <div class="card wcard cta" id="cv"><span class="cico">🎙️</span><div class="ctt">اضغط هنا</div><div class="cts">اذا تريد تتواصل وياية بتسجيل صوتك</div></div>
      <div class="card wcard cta" id="ct"><span class="cico">⌨️</span><div class="ctt">اضغط هنا</div><div class="cts">اذا تريد تتواصل وياية بالكتابة</div></div>
    </div>
    <hr class="sep">
    <div class="grid">${PHRASES.map(p=>`<div class="card" data-p="${esc(p.id)}">${pic(p)}<div class="label">${esc(p.title)}</div></div>`).join("")}</div>
    <hr class="sep">
    <div class="grid">${QUICK.map((q,i)=>`<div class="card" data-q="${i}"><span class="emo">📅</span><div class="label">${q.l}</div></div>`).join("")}</div>`;
  $("#cv").onclick=openVoiceModal;
  $("#ct").onclick=openTextModal;
  view.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>openResultModal([QUICK[Number(el.dataset.q)].f()]));
  view.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>openResultModal([PHRASES.find(p=>p.id===el.dataset.p)]));
  if(!voiceInfo) probeVoice().then(v=>{voiceInfo=v});
}

/* ============ تثبيت التطبيق + العمل بدون نت ============ */
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("#inst").style.display="inline-block"});
addEventListener("appinstalled",()=>{$("#inst").style.display="none"});
$("#inst").onclick=async()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{await deferredInstall.userChoice}catch(e){}
  deferredInstall=null; $("#inst").style.display="none";
};
if(!navigator.onLine) $("#offi").textContent="📴";
if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="done") $("#offi").textContent="📴✅";
  });
}
async function warmCache(){
  if(!("serviceWorker" in navigator)||!navigator.onLine) return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const urls=[...new Set([
      ...WINS.map(w=>w.img),
      ...PHRASES.map(p=>p.img),
      ...Object.values(UI.icons||{}).map(v=>v&&v.url)
    ].filter(u=>/^https?:\/\//i.test(u||"")))];
    const h={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
    const rest=Object.values(Q).map(p=>({url:API(p),headers:h}));
    if(reg.active) reg.active.postMessage({type:"precache",urls:urls,rest:rest});
  }catch(e){}
}

loadData()
  .then(()=>{applyUI();showWins();warmCache()})
  .catch(()=>{view.innerHTML='<div class="empty">📴</div>'});
</script>
