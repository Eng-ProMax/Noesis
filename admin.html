<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
:root{--bg:#f3ead9;--card:#fbf5e8;--text:#4a3b28;--accent:#b5793a;--border:#e0d2b6;--danger:#c4503a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#eef1f6;--accent:#f0b429;--border:#2b303b;--danger:#ff6b6b}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
h1{font-size:18px;padding:14px 16px;border-bottom:1px solid var(--border);text-align:center}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-bottom-right-radius:4px}
.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.msg img{max-width:220px;max-height:220px;border-radius:12px;display:block;margin-top:6px}
#ctl{padding:12px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);max-height:45vh;overflow:auto}
#ctl button{padding:12px 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
#ctl button.alt{background:var(--card);color:var(--text);border-color:var(--border)}
#ctl button.danger{background:var(--danger);border-color:var(--danger)}
#ctl input[type=text],#ctl input[type=password],#ctl input[type=email],#ctl textarea{flex:1;min-width:160px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;outline:none;font-family:inherit}
#ctl input[type=file]{flex:1;padding:10px;font-size:15px;color:var(--text)}
#ctl input[type=color]{width:70px;height:48px;padding:2px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer}
</style>
</head>
<body>
<h1>🤟 لوحة التحكم</h1>
<div id="log"></div>
<div id="ctl"></div>

<script>
const URL_ = "https://mxlaeygympuvsppvjivl.supabase.co";
const KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14bGFleWd5bXB1dnNwcHZqaXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTA3NDMsImV4cCI6MjEwNzIyNjc0M30.mfy_J-lPmfl5CBfZ3JSmabxtnkKexunU4GRHxj1W-p0";

let token=null, S={}, UI={};
const log=document.getElementById("log"), ctl=document.getElementById("ctl");

const DEF_THEMES={
  white:{bg:"#ffffff",card:"#f4f6fa",text:"#1b2433",accent:"#3b6cf6",border:"#dfe4ee"},
  beige:{bg:"#f3ead9",card:"#fbf5e8",text:"#4a3b28",accent:"#b5793a",border:"#e0d2b6"},
  black:{bg:"#0f1115",card:"#1a1d24",text:"#eef1f6",accent:"#f0b429",border:"#2b303b"},
  pink:{bg:"#fff0f5",card:"#ffe4ec",text:"#5a2a3c",accent:"#e0719a",border:"#f5c6d6"}
};
const THEME_NAMES={white:"⚪ أبيض",beige:"🟤 بيج",black:"⚫ أسود",pink:"🌸 وردي"};
const COLOR_NAMES={bg:"الخلفية",card:"البطاقات",text:"النص",accent:"اللون الأساسي",border:"الحدود"};
const ICON_DEF={logo:["🤟","الشعار"],win:[image.jpg,"تبويب النوافذ"],voice:["🎙️","تبويب الصوت"]};
const DEF_STYLE={flat:true,blend:true,size:100};
const curStyle=()=>({...DEF_STYLE,...(UI.style||{})});

/* أنواع المحتوى: النوافذ والعبارات الصوتية */
const KINDS={
  win:{table:"windows",folder:"windows",name:"نافذة",plural:"النوافذ",icon:"🛎️",
    fields:[["title","الاسم","اكتب الاسم اللي يظهر للأصم (مثال: نافذة 3 - الاستنساخ)"]]},
  phr:{table:"phrases",folder:"phrases",name:"عبارة",plural:"العبارات الصوتية",icon:"🎙️",
    fields:[["title","الاسم","اكتب اسم العبارة (مثال: الحمام)"],["keywords","كلمات التعرف","اكتب الكلمات اللي ينطقها الموظف وافصل بينها بفاصلة (مثال: حمام, تواليت, حمامات)"]]}
};

function add(cls,t){const d=document.createElement("div");d.className="msg "+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const bot=t=>add("bot",t), me=t=>add("me",t);
function err(e){bot("❌ صار خطأ:\n"+(e.message||e));stepMenu()}
function errTo(e,fn){bot("❌ صار خطأ:\n"+(e.message||e));fn()}

function buttons(list){
  ctl.innerHTML="";
  list.forEach(([label,fn,cls])=>{const b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.onclick=()=>{me(label);fn()};ctl.appendChild(b)});
}
function ask(ph,cb,o={}){
  ctl.innerHTML="";
  const i=document.createElement(o.multi?"textarea":"input");
  if(o.multi)i.rows=4;else i.type=o.type||"text";
  i.placeholder=ph;
  const b=document.createElement("button");b.textContent="إرسال";
  const go=()=>{const v=i.value.trim();if(!v&&!o.skip)return;me(o.type==="password"?"••••••":(v||"—"));cb(v)};
  b.onclick=go;
  if(!o.multi)i.onkeydown=e=>{if(e.key==="Enter")go()};
  ctl.append(i,b);
  if(o.skip){const s=document.createElement("button");s.className="alt";s.textContent="تخطي";s.onclick=()=>{me("تخطي");cb("")};ctl.append(s)}
  i.focus();
}
function pickColor(cur,cb,back){
  ctl.innerHTML="";
  const i=document.createElement("input");i.type="color";i.value=/^#[0-9a-f]{6}$/i.test(cur)?cur:"#ffffff";
  const b=document.createElement("button");b.textContent="✔️ حفظ اللون";
  b.onclick=()=>{me("🎨 "+i.value);cb(i.value)};
  const x=document.createElement("button");x.className="alt";x.textContent="🔙 رجوع";x.onclick=back;
  ctl.append(i,b,x);
}

const H=()=>({apikey:KEY,Authorization:"Bearer "+(token||KEY),"Content-Type":"application/json"});
async function db(path,opt={}){
  const r=await fetch(URL_+"/rest/v1/"+path,{...opt,headers:{...H(),...(opt.headers||{})}});
  const t=await r.text();
  if(!r.ok)throw new Error(t);
  return t?JSON.parse(t):null;
}

/* ===== رفع وحذف ملفات ===== */
async function uploadFile(path,file){
  const r=await fetch(`${URL_}/storage/v1/object/media/${path}`,{
    method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":file.type||"image/png"},
    body:file
  });
  if(!r.ok)throw new Error(await r.text());
  return `${URL_}/storage/v1/object/public/media/${path}`;
}
async function removeFileByUrl(url){
  try{
    if(!url)return;
    const p=url.split("/object/public/media/")[1];
    if(!p)return;
    await fetch(`${URL_}/storage/v1/object/media/${p}`,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+token}});
  }catch(e){}
}
const extOf=f=>((f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,""))||"png";

/* ===== إزالة الخلفية البيضاء (من الأطراف فقط) ===== */
function stripWhite(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const sc=Math.min(1,900/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const x=c.getContext("2d",{willReadFrequently:true});
        x.drawImage(img,0,0,w,h);
        const d=x.getImageData(0,0,w,h), p=d.data, seen=new Uint8Array(w*h), st=[];
        const white=i=>p[i*4+3]<10||(p[i*4]>232&&p[i*4+1]>232&&p[i*4+2]>232);
        const push=i=>{if(!seen[i]&&white(i)){seen[i]=1;st.push(i)}};
        for(let a=0;a<w;a++){push(a);push((h-1)*w+a)}
        for(let b=0;b<h;b++){push(b*w);push(b*w+w-1)}
        while(st.length){
          const i=st.pop(),px=i%w,py=(i/w)|0;
          p[i*4+3]=0;
          if(px>0)push(i-1);if(px<w-1)push(i+1);if(py>0)push(i-w);if(py<h-1)push(i+w);
        }
        x.putImageData(d,0,0);
        c.toBlob(b=>{
          URL.revokeObjectURL(u);
          b?res(new File([b],file.name.replace(/\.[^.]+$/,"")+".png",{type:"image/png"})):rej(new Error("فشلت المعالجة"));
        },"image/png");
      }catch(e){rej(e)}
    };
    img.onerror=()=>rej(new Error("ما قدرت أقرأ الصورة"));
    img.src=u;
  });
}
function prepImage(file,cb){
  bot("تريد أشيل الخلفية البيضاء حتى تندمج الصورة مع الموقع؟");
  buttons([
    ["✨ إي، شيلها",async()=>{try{bot("جاري المعالجة...");cb(await stripWhite(file))}catch(e){err(e)}}],
    ["📷 لا، كما هي",()=>cb(file),"alt"]
  ]);
}

/* ===== الإعدادات ===== */
async function loadUI(){
  try{const r=await db("settings?select=value&key=eq.ui");UI=(r&&r[0]&&r[0].value)||{}}
  catch(e){UI={};bot("⚠️ جدول الإعدادات غير موجود. شغّل SQL أولاً.")}
}
async function saveUI(back){
  try{
    await db("settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({key:"ui",value:UI})});
    bot("تم الحفظ ✅ افتح الموقع وحدّث الصفحة.");
    return true;
  }catch(e){errTo(e,back||stepDesign);return false}
}

/* ===== تسجيل الدخول ===== */
function stepLogin(){
  bot("هلا 👋 سجّل دخول أولاً.\nشنو الإيميل؟");
  ask("الإيميل",email=>{
    bot("والباسورد؟");
    ask("الباسورد",async pw=>{
      try{
        const r=await fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
        const j=await r.json();
        if(!r.ok)throw new Error(j.error_description||j.msg||"فشل تسجيل الدخول");
        token=j.access_token;
        await loadUI();
        bot("تم تسجيل الدخول ✅");
        stepMenu();
      }catch(e){bot("❌ "+e.message);stepLogin()}
    },{type:"password"});
  },{type:"email"});
}

/* ===== القائمة الرئيسية ===== */
function stepMenu(){
  bot("شنو تريد تسوي؟");
  buttons([
    ["🛎️ النوافذ",()=>kindMenu("win")],
    ["🎙️ العبارات الصوتية",()=>kindMenu("phr")],
    ["🎨 تصميم الموقع",stepDesign]
  ]);
}

/* ===== النوافذ والعبارات (إضافة / تعديل / حذف) ===== */
function kindMenu(k){
  const K=KINDS[k];
  bot(K.icon+" "+K.plural+": شنو تريد؟");
  buttons([
    ["➕ إضافة "+K.name,()=>addKind(k)],
    ["✏️ تعديل / حذف",()=>listKind(k)],
    ["🏠 رجوع",stepMenu,"alt"]
  ]);
}
function addKind(k){
  const K=KINDS[k], data={};
  const next=i=>{
    if(i>=K.fields.length)return askEmoji();
    const [f,,hint]=K.fields[i];
    bot(hint);
    ask("اكتب هنا",v=>{data[f]=v||null;next(i+1)},{multi:!!(K.multi&&K.multi[f]),skip:i>0});
  };
  const askEmoji=()=>{
    bot("تريد إيموجي بديل؟ (يظهر إذا ما أكو صورة)");
    ask("مثال: "+K.icon,e=>save(e),{skip:true});
  };
  const save=async emo=>{
    try{
      const rows=await db(`${K.table}?select=sort&order=sort.desc&limit=1`);
      const sort=((rows&&rows[0]&&rows[0].sort)||0)+1;
      const row={id:k+Date.now().toString(36),...data,emoji:emo||null,sort};
      await db(K.table,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)});
      S.k=k;S.row=row;
      bot("تمت الإضافة ✅\nتريد تضيف صورة؟");
      buttons([["🖼️ إي، أضيف صورة",imgFile],["🏠 لا، القائمة",stepMenu,"alt"]]);
    }catch(e){err(e)}
  };
  next(0);
}
async function listKind(k){
  const K=KINDS[k];
  try{
    const rows=await db(`${K.table}?select=*&order=sort`);
    if(!rows.length){bot("ما أكو شي بعد.");return kindMenu(k)}
    bot("اختار:");
    buttons([...rows.map(r=>[(r.emoji||K.icon)+" "+r.title,()=>rowMenu(k,r)]),["🔙 رجوع",()=>kindMenu(k),"alt"]]);
  }catch(e){errTo(e,()=>kindMenu(k))}
}
function rowMenu(k,row){
  const K=KINDS[k];
  const lines=K.fields.map(([f,l])=>"• "+l+": "+(row[f]||"—")).join("\n");
  const d=bot(lines+"\n• الصورة: "+(row.image_url?"موجودة":"ماكو")+"\nشنو تريد تعدّل؟");
  if(row.image_url){const im=document.createElement("img");im.src=row.image_url;d.appendChild(im)}
  buttons([
    ...K.fields.map(([f,l,hint])=>["✏️ "+l,()=>editField(k,row,f,hint)]),
    ["🖼️ "+(row.image_url?"تغيير الصورة":"إضافة صورة"),()=>{S.k=k;S.row=row;imgFile()}],
    ["😀 الإيموجي",()=>editField(k,row,"emoji","اكتب الإيموجي البديل")],
    ["🗑️ حذف",()=>confirmDel(K.name+" «"+row.title+"»",()=>doDel(k,row)),"danger"],
    ["🔙 رجوع",()=>listKind(k),"alt"]
  ]);
}
function editField(k,row,f,hint){
  const K=KINDS[k];
  bot(hint+(row[f]?"\nالحالي: "+row[f]:""));
  ask("اكتب هنا",async v=>{
    try{
      const val=v||null;
      await db(`${K.table}?id=eq.${row.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({[f]:val})});
      row[f]=val;
      bot("انحفظ ✅");
      rowMenu(k,row);
    }catch(e){errTo(e,()=>rowMenu(k,row))}
  },{multi:!!(K.multi&&K.multi[f]),skip:f!=="title"});
}
function imgFile(){
  bot("اختار الصورة من جهازك 👇");
  ctl.innerHTML="";
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{const file=f.files[0];if(!file)return;me("📷 "+file.name);prepImage(file,uploadImg)};
  ctl.append(f);
}
async function uploadImg(file){
  const K=KINDS[S.k], row=S.row;
  bot("جاري الرفع...");
  ctl.innerHTML="";
  try{
    const old=row.image_url;
    const url=await uploadFile(`${K.folder}/${row.id}-${Date.now()}.${extOf(file)}`,file);
    await db(`${K.table}?id=eq.${row.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({image_url:url})});
    row.image_url=url;
    await removeFileByUrl(old);
    bot("تم حفظ الصورة ✅");
    rowMenu(S.k,row);
  }catch(e){err(e)}
}
function confirmDel(what,fn){
  bot("متأكد تريد تحذف "+what+"؟ ما يمكن التراجع ⚠️");
  buttons([["🗑️ إي، احذف",fn,"danger"],["❌ إلغاء",()=>{bot("تم الإلغاء.");stepMenu()},"alt"]]);
}
async function doDel(k,row){
  const K=KINDS[k];
  try{
    const r=await db(`${K.table}?id=eq.${row.id}`,{method:"DELETE",headers:{Prefer:"return=representation"}});
    if(!r||!r.length)throw new Error("ما انحذفت. تأكد إنك شغّلت SQL الصلاحيات.");
    await removeFileByUrl(row.image_url);
    bot("انحذفت ✅");
    kindMenu(k);
  }catch(e){errTo(e,()=>kindMenu(k))}
}

/* ===== تصميم الموقع ===== */
function stepDesign(){
  bot("شنو تريد تعدّل بالتصميم؟");
  buttons([
    ["🌈 ألوان الثيمات",colorTheme],
    ["🔣 الأيقونات",iconPick],
    ["🧩 شكل البطاقات والصور",styleMenu],
    ["🏠 القائمة",stepMenu,"alt"]
  ]);
}
function colorTheme(){
  bot("أي ثيم تريد تعدّل ألوانه؟");
  buttons([...Object.keys(DEF_THEMES).map(t=>[THEME_NAMES[t],()=>colorKey(t)]),["🔙 رجوع",stepDesign,"alt"]]);
}
function colorKey(t){
  bot("ثيم "+THEME_NAMES[t]+"\nأي لون تريد تغيّر؟");
  buttons([
    ...Object.keys(COLOR_NAMES).map(k=>[COLOR_NAMES[k],()=>colorSet(t,k)]),
    ["↩️ الألوان الأصلية",()=>resetTheme(t),"alt"],
    ["🔙 رجوع",colorTheme,"alt"]
  ]);
}
function colorSet(t,k){
  const cur={...DEF_THEMES[t],...((UI.themes||{})[t]||{})}[k];
  bot("اختار لون «"+COLOR_NAMES[k]+"» 👇");
  pickColor(cur,async v=>{
    UI.themes=UI.themes||{};
    UI.themes[t]={...(UI.themes[t]||{}),[k]:v};
    if(await saveUI(()=>colorKey(t)))colorKey(t);
  },()=>colorKey(t));
}
async function resetTheme(t){
  if(UI.themes)delete UI.themes[t];
  if(await saveUI(()=>colorKey(t)))colorKey(t);
}
const iconNow=k=>{const v=(UI.icons||{})[k];return v&&v.url?"🖼️":(v&&v.emoji)||ICON_DEF[k][0]};
function iconPick(){
  bot("أي أيقونة تريد تغيّر؟");
  buttons([...Object.keys(ICON_DEF).map(k=>[iconNow(k)+" "+ICON_DEF[k][1],()=>iconSet(k)]),["🔙 رجوع",stepDesign,"alt"]]);
}
function iconSet(k){
  bot("شنو تريد تحط لـ «"+ICON_DEF[k][1]+"»؟");
  buttons([
    ["😀 إيموجي",()=>{bot("اكتب أو الصق الإيموجي:");ask("مثال: 🎯",v=>setIcon(k,{emoji:v}))}],
    ["📷 صورة من جهازي",()=>iconFile(k)],
    ["↩️ الأصلي",()=>setIcon(k,null),"alt"],
    ["🔙 رجوع",iconPick,"alt"]
  ]);
}
async function setIcon(k,val){
  UI.icons=UI.icons||{};
  const old=UI.icons[k]&&UI.icons[k].url;
  if(val)UI.icons[k]=val;else delete UI.icons[k];
  if(await saveUI(iconPick)){
    if(old&&(!val||val.url!==old))await removeFileByUrl(old);
    iconPick();
  }
}
function iconFile(k){
  bot("اختار صورة الأيقونة 👇 (الأفضل PNG مربعة)");
  ctl.innerHTML="";
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    me("📷 "+file.name);
    prepImage(file,async fl=>{
      try{
        bot("جاري الرفع...");ctl.innerHTML="";
        const url=await uploadFile(`icons/${k}-${Date.now()}.${extOf(fl)}`,fl);
        await setIcon(k,{url});
      }catch(e){errTo(e,iconPick)}
    });
  };
  ctl.append(f);
}
function styleMenu(){
  const s=curStyle();
  bot("الإعدادات الحالية:\n• البطاقات: "+(s.flat?"بدون إطار":"بإطار")+"\n• دمج الصور مع الخلفية: "+(s.blend?"شغّال":"طافي")+"\n• حجم الصور: "+s.size);
  buttons([
    [s.flat?"🖼️ رجّع الإطار":"🧩 بدون إطار",()=>setStyle({flat:!s.flat})],
    [s.blend?"🚫 طفّي الدمج":"✨ شغّل الدمج",()=>setStyle({blend:!s.blend})],
    ["📏 حجم الصور",sizePick],
    ["🔙 رجوع",stepDesign,"alt"]
  ]);
}
async function setStyle(p){
  UI.style={...curStyle(),...p};
  if(await saveUI(styleMenu))styleMenu();
}
function sizePick(){
  bot("اختار حجم الصور بالبطاقات:");
  buttons([["صغير",()=>setStyle({size:80})],["متوسط",()=>setStyle({size:100})],["كبير",()=>setStyle({size:130})],["ضخم",()=>setStyle({size:160})],["🔙 رجوع",styleMenu,"alt"]]);
}

stepLogin();
</script>
</body>
</html>
