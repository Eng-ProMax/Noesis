body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
h1{font-size:18px;padding:14px 16px;border-bottom:1px solid var(--border);text-align:center}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

  b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};

  if(o.skip){const s=document.createElement("button");s.className="alt";s.textContent="تخطي";s.onclick=()=>{me("تخطي");cb("")};ctl.append(s)}

}
function pickColor(cur,cb,back){
  ctl.innerHTML="";
  const i=document.createElement("input");i.type="color";i.value=/^#[0-9a-f]{6}$/i.test(cur)?cur:"#ffffff";

  b.onclick=()=>{me("🎨 "+i.value);cb(i.value)};
  const x=document.createElement("button");x.className="alt";x.textContent="🔙 رجوع";x.onclick=back;

const H=()=>({apikey:KEY,Authorization:"Bearer "+(token||KEY),"Content-Type":"application/json"});
async function db(path,opt={}){
  const r=await fetch(URL_+"/rest/v1/"+path,{...opt,headers:{...H(),...(opt.headers||{})}});
  const t=await r.text();
  if(!r.ok)throw new Error(t);
  return t?JSON.parse(t):null;
}

/* ===== رفع وحذف ملفات ===== */
async function uploadFile(path,file){
  const r=await fetch(`${URL_}/storage/v1/object/media/${path}`,{
    method:"POST",
    headers:{apikey:KEY,Authorization:"Bearer "+token,"Content-Type":file.type||"image/png"},
    body:file
  });
  if(!r.ok)throw new Error(await r.text());
  return `${URL_}/storage/v1/object/public/media/${path}`;
}
async function removeFileByUrl(url){
  try{
    if(!url)return;
    const p=url.split("/object/public/media/")[1];
    if(!p)return;
    await fetch(`${URL_}/storage/v1/object/media/${p}`,{method:"DELETE",headers:{apikey:KEY,Authorization:"Bearer "+token}});
  }catch(e){}
}
const extOf=f=>((f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,""))||"png";

/* ===== إزالة الخلفية البيضاء (من الأطراف فقط) ===== */
function stripWhite(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const sc=Math.min(1,900/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const x=c.getContext("2d",{willReadFrequently:true});
        x.drawImage(img,0,0,w,h);
        const d=x.getImageData(0,0,w,h), p=d.data, seen=new Uint8Array(w*h), st=[];
        const white=i=>p[i*4+3]<10||(p[i*4]>232&&p[i*4+1]>232&&p[i*4+2]>232);
        const push=i=>{if(!seen[i]&&white(i)){seen[i]=1;st.push(i)}};
        for(let a=0;a<w;a++){push(a);push((h-1)*w+a)}
        for(let b=0;b<h;b++){push(b*w);push(b*w+w-1)}
        while(st.length){
          const i=st.pop(),px=i%w,py=(i/w)|0;
          p[i*4+3]=0;
          if(px>0)push(i-1);if(px<w-1)push(i+1);if(py>0)push(i-w);if(py<h-1)push(i+w);
        }
        x.putImageData(d,0,0);
        c.toBlob(b=>{
          URL.revokeObjectURL(u);
          b?res(new File([b],file.name.replace(/\.[^.]+$/,"")+".png",{type:"image/png"})):rej(new Error("فشلت المعالجة"));
        },"image/png");
      }catch(e){rej(e)}
    };
    img.onerror=()=>rej(new Error("ما قدرت أقرأ الصورة"));
    img.src=u;
  });
}
function prepImage(file,cb){
  bot("تريد أشيل الخلفية البيضاء حتى تندمج الصورة مع الموقع؟");
  buttons([
    ["✨ إي، شيلها",async()=>{try{bot("جاري المعالجة...");cb(await stripWhite(file))}catch(e){err(e)}}],
    ["📷 لا، كما هي",()=>cb(file),"alt"]
  ]);
}

/* ===== الإعدادات ===== */
async function loadUI(){
  try{const r=await db("settings?select=value&key=eq.ui");UI=(r&&r[0]&&r[0].value)||{}}
  catch(e){UI={};bot("⚠️ جدول الإعدادات غير موجود. شغّل SQL الجديد أولاً.")}
}
async function saveUI(back){
  try{
    await db("settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({key:"ui",value:UI})});
    bot("تم الحفظ ✅ افتح الموقع وسوّي Ctrl+F5.");
    return true;
  }catch(e){errTo(e,back||stepDesign);return false}
}

/* ===== تسجيل الدخول ===== */
function stepLogin(){
  bot("هلا 👋 سجّل دخول أولاً.\nشنو الإيميل؟");
  ask("الإيميل",email=>{
    bot("والباسورد؟");
    ask("الباسورد",async pw=>{

        const r=await fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})});
        const j=await r.json();
        if(!r.ok)throw new Error(j.error_description||j.msg||"فشل تسجيل الدخول");
        token=j.access_token;
        cats=await db("categories?select=*&order=sort");

        bot("تم تسجيل الدخول ✅");

/* الألوان */
function colorTheme(){
  bot("أي ثيم تريد تعدّل ألوانه؟");
  buttons([...Object.keys(DEF_THEMES).map(t=>[THEME_NAMES[t],()=>colorKey(t)]),["🔙 رجوع",stepDesign,"alt"]]);
}
function colorKey(t){
  bot("ثيم "+THEME_NAMES[t]+"\nأي لون تريد تغيّر؟");
  buttons([
    ...Object.keys(COLOR_NAMES).map(k=>[COLOR_NAMES[k],()=>colorSet(t,k)]),
    ["↩️ الألوان الأصلية",()=>resetTheme(t),"alt"],
    ["🔙 رجوع",colorTheme,"alt"]
  ]);
}
function colorSet(t,k){
  const cur={...DEF_THEMES[t],...((UI.themes||{})[t]||{})}[k];
  bot("اختار لون «"+COLOR_NAMES[k]+"» 👇");
  pickColor(cur,async v=>{
    UI.themes=UI.themes||{};
    UI.themes[t]={...(UI.themes[t]||{}),[k]:v};
    if(await saveUI(()=>colorKey(t)))colorKey(t);
  },()=>colorKey(t));
}
async function resetTheme(t){
  if(UI.themes)delete UI.themes[t];
  if(await saveUI(()=>colorKey(t)))colorKey(t);
}

/* الأيقونات */
const iconNow=k=>{const v=(UI.icons||{})[k];return v&&v.url?"🖼️":(v&&v.emoji)||ICON_DEF[k][0]};
function iconPick(){
  bot("أي أيقونة تريد تغيّر؟");
  buttons([...Object.keys(ICON_DEF).map(k=>[iconNow(k)+" "+ICON_DEF[k][1],()=>iconSet(k)]),["🔙 رجوع",stepDesign,"alt"]]);
}
function iconSet(k){
  bot("شنو تريد تحط لـ «"+ICON_DEF[k][1]+"»؟");
  buttons([
    ["😀 إيموجي",()=>{bot("اكتب أو الصق الإيموجي:");ask("مثال: 🎯",v=>setIcon(k,{emoji:v}))}],
    ["📷 صورة من جهازي",()=>iconFile(k)],
    ["↩️ الأصلي",()=>setIcon(k,null),"alt"],
    ["🔙 رجوع",iconPick,"alt"]
  ]);
}
async function setIcon(k,val){
  UI.icons=UI.icons||{};
  const old=UI.icons[k]&&UI.icons[k].url;
  if(val)UI.icons[k]=val;else delete UI.icons[k];
  if(await saveUI(iconPick)){
    if(old&&(!val||val.url!==old))await removeFileByUrl(old);
    iconPick();
  }
}
function iconFile(k){
  bot("اختار صورة الأيقونة 👇 (الأفضل PNG مربعة)");
  ctl.innerHTML="";
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    me("📷 "+file.name);
    prepImage(file,async fl=>{
      try{
        bot("جاري الرفع...");ctl.innerHTML="";
        const url=await uploadFile(`icons/${k}-${Date.now()}.${extOf(fl)}`,fl);
        await setIcon(k,{url});
      }catch(e){errTo(e,iconPick)}
    });
  };
  ctl.append(f);
}

/* شكل البطاقات */
function styleMenu(){
  const s=curStyle();
  bot("الإعدادات الحالية:\n• البطاقات: "+(s.flat?"بدون إطار":"بإطار")+"\n• دمج الصور مع الخلفية: "+(s.blend?"شغّال":"طافي")+"\n• حجم الصور: "+s.size);
  buttons([
    [s.flat?"🖼️ رجّع الإطار":"🧩 بدون إطار",()=>setStyle({flat:!s.flat})],
    [s.blend?"🚫 طفّي الدمج":"✨ شغّل الدمج",()=>setStyle({blend:!s.blend})],
    ["📏 حجم الصور",sizePick],
    ["🔙 رجوع",stepDesign,"alt"]
  ]);
}
async function setStyle(p){
  UI.style={...curStyle(),...p};
  if(await saveUI(styleMenu))styleMenu();
}
function sizePick(){
  bot("اختار حجم الصور بالبطاقات:");
  buttons([["صغير",()=>setStyle({size:80})],["متوسط",()=>setStyle({size:100})],["كبير",()=>setStyle({size:130})],["ضخم",()=>setStyle({size:160})],["🔙 رجوع",styleMenu,"alt"]]);
}

/* ===== الفئة ===== */
function stepCat(){
  bot("اختار الفئة:");
  buttons([...cats.map(c=>[(c.emoji||"")+" "+c.name,()=>{S.cat=c;stepName()}]),["➕ فئة جديدة",newCat],["🏠 رجوع",stepMenu,"alt"]]);
}
function newCat(){
  bot("شنو اسم الفئة الجديدة؟");
  ask("اسم الفئة",name=>{
    bot("شنو الإيموجي مالها؟");
    ask("مثال: 🍽️",async emo=>{
      try{
        const row={id:"c"+Date.now().toString(36),name,emoji:emo,sort:cats.length+1};
        await db("categories",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)});
        cats.push(row);S.cat=row;
        bot("انضافت الفئة ✅\nتريد تضيف صورة لها؟");
        buttons([
          ["🖼️ إي، أضيف صورة",catImgFile],
          ["📝 لا، أضيف كلمة",stepName],
          ["🏠 القائمة",stepMenu,"alt"]
        ]);
      }catch(e){err(e)}
    });
  });
}

/* ===== صورة للفئة ===== */
function catImgPick(){
  bot("لأي فئة تريد تضيف صورة؟");
  buttons([...cats.map(c=>[(c.emoji||"")+" "+c.name,()=>{S.cat=c;catImgFile()}]),["🏠 رجوع",stepMenu,"alt"]]);
}
function catImgFile(){
  bot("اختار صورة الفئة «"+S.cat.name+"» من جهازك 👇");
  ctl.innerHTML="";
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{const file=f.files[0];if(!file)return;me("📷 "+file.name);prepImage(file,uploadCatImg)};
  ctl.append(f);
}
async function uploadCatImg(file){
  bot("جاري الرفع...");
  ctl.innerHTML="";
  try{
    const old=S.cat.image_url;
    const url=await uploadFile(`categories/${S.cat.id}-${Date.now()}.${extOf(file)}`,file);
    await db(`categories?id=eq.${S.cat.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({image_url:url})});
    S.cat.image_url=url;
    await removeFileByUrl(old);
    const d=bot("تم حفظ صورة الفئة «"+S.cat.name+"» ✅");
    const im=document.createElement("img");im.src=url;d.appendChild(im);
    stepMenu();
  }catch(e){err(e)}
}

/* ===== الكلمة ===== */
function stepName(){
  bot("شنو اسم الكلمة؟ (مثال: تفاحة)");
  ask("الكلمة",async name=>{
    try{
      S.name=name;S.emoji="";
      const ex=await db(`items?select=*&category_id=eq.${S.cat.id}&name=eq.${encodeURIComponent(name)}`);
      if(ex.length){
        S.item=ex[0];
        bot("هذي الكلمة موجودة من قبل، راح أضيف الصورة لها.");
        stepKind();
      }else{
        S.item=null;
        bot("تريد إيموجي بديل للكلمة؟ (يظهر إذا الصورة ما موجودة)");
        ask("🍎",emo=>{S.emoji=emo;stepKind()},{skip:true});
      }
    }catch(e){err(e)}
  });
}

/* ===== نوع الصورة والرفع ===== */
function stepKind(){
  bot("شنو نوع الصورة؟");
  buttons([
    ["🖼️ صورة الشيء",()=>{S.kind="images";stepFile()}],
    ["🤟 صورة الإشارة",()=>{S.kind="signs";stepFile()}]
  ]);
}
function stepFile(){
  bot("اختار الصورة من جهازك 👇");
  ctl.innerHTML="";
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    me("📷 "+file.name);
    if(S.kind==="images")prepImage(file,upload);else upload(file);
  };
  ctl.append(f);
}
async function upload(file){
  bot("جاري الرفع...");
  ctl.innerHTML="";
  try{
    if(!S.item){
      const row={id:"i"+Date.now().toString(36),category_id:S.cat.id,name:S.name,emoji:S.emoji||null};
      await db("items",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)});
      S.item=row;
    }
    const url=await uploadFile(`${S.kind}/${S.cat.id}/${S.item.id}-${Date.now()}.${extOf(file)}`,file);
    const col=S.kind==="images"?"image_url":"sign_url";
    await db(`items?category_id=eq.${S.cat.id}&id=eq.${S.item.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({[col]:url})});
    const d=bot("تم الرفع وربطها بالكلمة «"+S.name+"» ✅");
    const im=document.createElement("img");im.src=url;d.appendChild(im);
    nextMenu();
  }catch(e){err(e)}
}

function nextMenu(){
  bot("شنو تريد هسة؟");
  buttons([
    ["➕ صورة ثانية لنفس الكلمة",()=>S.item?stepKind():stepName()],
    ["📝 كلمة جديدة بنفس الفئة",stepName],
    ["📂 فئة ثانية",stepCat],
    ["🏠 القائمة الرئيسية",stepMenu,"alt"]
  ]);
}

/* ===== الحذف ===== */
function confirmDel(what,fn){
  bot("متأكد تريد تحذف "+what+"؟ ما يمكن التراجع ⚠️");
  buttons([["🗑️ إي، احذف",fn,"danger"],["❌ إلغاء",()=>{bot("تم الإلغاء.");stepMenu()},"alt"]]);
}
function delItemCat(){
  bot("من أي فئة تريد تحذف كلمة؟");
  buttons([...cats.map(c=>[(c.emoji||"")+" "+c.name,()=>delItemList(c)]),["🏠 رجوع",stepMenu,"alt"]]);
}
async function delItemList(c){
  try{
    const its=await db(`items?select=*&category_id=eq.${c.id}&order=name`);
    if(!its.length){bot("هذي الفئة فارغة.");return stepMenu()}
    bot("اختار الكلمة اللي تريد تحذفها:");
    buttons([...its.map(i=>[(i.emoji||"")+" "+i.name,()=>confirmDel("الكلمة «"+i.name+"»",()=>doDelItem(i))]),["🏠 رجوع",stepMenu,"alt"]]);
  }catch(e){err(e)}
}
async function doDelItem(i){
  try{
    const r=await db(`items?category_id=eq.${i.category_id}&id=eq.${i.id}`,{method:"DELETE",headers:{Prefer:"return=representation"}});
    if(!r||!r.length)throw new Error("ما انحذفت. تأكد إنك شغّلت SQL صلاحيات الحذف.");
    await removeFileByUrl(i.image_url);
    await removeFileByUrl(i.sign_url);
    bot("انحذفت الكلمة «"+i.name+"» ✅");
    stepMenu();
  }catch(e){err(e)}
}
function delCatPick(){
  bot("اختار الفئة اللي تريد تحذفها:\n(تنحذف معها كل كلماتها)");
  buttons([...cats.map(c=>[(c.emoji||"")+" "+c.name,()=>confirmDel("الفئة «"+c.name+"» مع كل كلماتها",()=>doDelCat(c))]),["🏠 رجوع",stepMenu,"alt"]]);
}
async function doDelCat(c){
  try{
    const its=await db(`items?select=*&category_id=eq.${c.id}`);
    const r=await db(`categories?id=eq.${c.id}`,{method:"DELETE",headers:{Prefer:"return=representation"}});
    if(!r||!r.length)throw new Error("ما انحذفت. تأكد إنك شغّلت SQL صلاحيات الحذف.");
    for(const i of its){await removeFileByUrl(i.image_url);await removeFileByUrl(i.sign_url)}
    await removeFileByUrl(c.image_url);
    cats=cats.filter(x=>x.id!==c.id);
    bot("انحذفت الفئة «"+c.name+"» وكلماتها ✅");
    stepMenu();
  }catch(e){err(e)}
}

stepLogin();
